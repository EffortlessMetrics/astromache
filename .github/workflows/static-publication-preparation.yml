name: Static publication starter candidate
on:
  push:
    branches: [feat/native-static-publication-20261109]
permissions:
  contents: read
concurrency:
  group: static-publication-starter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.0
      - name: Checkout the exact core source without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: EffortlessMetrics/astromache-core
          ref: 0b89706a6198f53e0e6e040d4a87d9dec8cc0145
          path: .publication-core
          persist-credentials: false
      - name: Prepare source and exact archive without changing workflows
        run: |
          if test -f scripts/prepare-static-publication.mjs; then
            node scripts/prepare-static-publication.mjs .publication-core
            git rm scripts/prepare-static-publication.mjs
            git config user.name EffortlessSteven
            git config user.email 15812269+EffortlessSteven@users.noreply.github.com
            git add README.md package.json pnpm-lock.yaml site.config.mjs astro.config.mjs STARTER-DELIVERY.json candidate-artifacts.json src/layouts/Publication.astro 'src/pages/notes/[...slug].astro' public/_headers scripts/verify-static-publication.mjs vendor/astromache-0.3.0-publishing.1.tgz
            git diff --cached --check
            git commit -m "Adopt native static publishing with one consumer policy"
            git push origin HEAD:refs/heads/feat/native-static-publication-20261109
          fi
          rm -rf .publication-core .publication-preparation
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record exact source
        if: always()
        run: |
          mkdir -p .publication-evidence
          git rev-parse HEAD > .publication-evidence/source.txt
          git rev-parse HEAD^{tree} >> .publication-evidence/source.txt
          node --version >> .publication-evidence/source.txt
          pnpm --version >> .publication-evidence/source.txt
          git archive --format=tar HEAD | gzip > .publication-evidence/source.tar.gz
      - run: pnpm qualify
      - run: pnpm verify:licenses && pnpm test:licenses
      - run: node --test scripts/search-form.test.mjs scripts/publication-navigation.test.mjs scripts/publication-serialization.test.mjs
      - run: pnpm verify:publication
      - name: Retain installed dependency cache for bounded local investigation
        if: always()
        run: |
          test -d node_modules && tar -czf .publication-evidence/runtime.tgz node_modules || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: starter-static-publication-${{ github.sha }}
          path: .publication-evidence/
          if-no-files-found: error
          retention-days: 14
